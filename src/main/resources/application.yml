spring:
  application:
    name: mini-bank

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/minibank}
    username: ${DB_USER:minibank}
    password: ${DB_PASSWORD:minibank}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  # Local development value only; set JWT_SECRET in any real environment
  secret: ${JWT_SECRET:LMdDWZPQ5v06zwQgcFz6a59OSOoX6Jhx0VnBxGrENFg=}
  expiration-minutes: 60

app:
  admin:
    email: ${ADMIN_EMAIL:admin@minibank.local}
    password: ${ADMIN_PASSWORD:admin12345}
